<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trazabilidad y Garantía de PC</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>

<h1>Sistema de Garantía y Trazabilidad</h1>
<p id="system-status" style="font-weight: bold;"></p>

<div class="grid-container">
  
  <div class="panel">
    <h2>1. Registro Inicial (Crear PC)</h2>
    <label>ID del Equipo (Serie/QR):</label>
    <input type="text" id="reg-pc-id" placeholder="Ej: PC-GAMER-001">
    <label>S/N Procesador (CPU):</label>
    <input type="text" id="reg-cpu">
    <label>S/N Tarjeta Gráfica (GPU):</label>
    <input type="text" id="reg-gpu">
    <label>S/N Memoria RAM:</label>
    <input type="text" id="reg-ram">
    <label>S/N Almacenamiento (SSD):</label>
    <input type="text" id="reg-ssd">
    <label>S/N Placa Base (MB):</label>
    <input type="text" id="reg-motherboard">
    <button onclick="registrarEquipoNuevo()">Crear Cadena</button>
  </div>

  <div class="panel">
    <h2>2. Nuevo Evento (Mantenimiento)</h2>
    <label>Buscar ID del Equipo:</label>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="ev-pc-id" placeholder="Ej: PC-GAMER-001">
      <button class="secondary-btn" style="margin-top: 4px; width: 40%;" onclick="buscarEquipoParaEvento()">Buscar Cadena</button>
    </div>

    <div id="evento-form" class="hidden" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
      <label>Tipo de Evento:</label>
      <select id="ev-tipo" onchange="toggleEdicionComponentes()">
        <option value="Mantenimiento Preventivo">Mantenimiento Preventivo (Sin cambios)</option>
        <option value="Cambio Autorizado">Cambio de Componente Autorizado</option>
      </select>
      
      <label>S/N CPU:</label>
      <input type="text" id="ev-cpu" readonly>
      <label>S/N GPU:</label>
      <input type="text" id="ev-gpu" readonly>
      <label>S/N RAM:</label>
      <input type="text" id="ev-ram" readonly>
      <label>S/N SSD:</label>
      <input type="text" id="ev-ssd" readonly>
      <label>S/N Motherboard:</label>
      <input type="text" id="ev-motherboard" readonly>

      <button onclick="registrarEventoAdicional()">Añadir Bloque a esta Cadena</button>
    </div>
  </div>

 <div class="panel">
    <h2>3. Verificación de Garantía</h2>
    <label>ID del Equipo:</label>
    <input type="text" id="ver-pc-id">
    <label>S/N CPU detectado:</label>
    <input type="text" id="ver-cpu">
    <label>S/N GPU detectado:</label>
    <input type="text" id="ver-gpu">
    <label>S/N RAM detectada:</label>
    <input type="text" id="ver-ram">
    <label>S/N SSD detectado:</label>
    <input type="text" id="ver-ssd">
    <label>S/N Motherboard detectada:</label>
    <input type="text" id="ver-motherboard">

    <label style="margin-top: 15px; display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
      <input type="checkbox" id="ver-so-fabrica" checked style="width: auto; margin: 0;">
      ¿Conserva el Sistema Operativo de fábrica?
    </label>

    <button class="alert-btn" onclick="verificarGarantia()">Verificar Garantía</button>
    <div id="warranty-status" class="status-box"></div>
  </div>

</div>

<div class="panel full-width">
  <h2>Trazabilidad</h2>
  <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
    <label style="margin:0;">Filtrar por ID de Equipo:</label>
    <input type="text" id="filtro-historial" placeholder="Escribe un ID..." onkeyup="render()" style="width: 300px; margin: 0;">
  </div>
  <div id="all-chains"></div>
</div>
>
<script src="blockchain.js"></script>
<script src="app.js"></script>

</body>
</html>
